version: '3'

includes:
  validate-prerequisites: ./tasks/validate-prerequisites/validate-prerequisite-tasks.yml
  snow-cli:
    taskfile: ./tasks/snow-cli/snowcli-tasks.yml
    dir: ./tasks/snow-cli
  dbt-projects:
    taskfile: ./tasks/snow-cli/dbt-projects/dbt-projects-tasks.yml
    dir: ./tasks/snow-cli/dbt-projects
  dbt:
    taskfile: ./tasks/dbt/dbt-tasks.yml

env:
  ENV_DIR: .env

dotenv: ['{{ .ENV_DIR }}/{{ .DOTENV_FILENAME | default "demo.env" }}']

tasks:

  snowflake-resources-up:
    desc: Validates Snowflake CLI, bootstraps the util database, then reconciles all infrastructure.
    internal: true
    cmds:
      - task: validate-prerequisites:snowcli
      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/bootstrap
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
      - task: snow-cli:dcm-create
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DCM_TARGET: '{{.DCM_TARGET | default "DEV"}}'
          DCM_IDENTIFIER: '{{.DCM_IDENTIFIER | default ""}}'
      - task: snow-cli:dcm-deploy
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DCM_TARGET: '{{.DCM_TARGET | default "DEV"}}'
          DCM_IDENTIFIER: '{{.DCM_IDENTIFIER | default ""}}'
          DCM_VARIABLES: '{{.DCM_VARIABLES | default ""}}'
          DCM_ALIAS: '{{.DCM_ALIAS | default "demo_up"}}'

  seed-raw-source-tables:
    desc: Loads any RAW source table that is empty by COPY INTO from the public Tasty Bytes S3 bucket.
    internal: true
    vars:
      # The database to load into, which is also the DCM `base` for the target.
      # dev_dbt_demo by default; demo-up-pdb overrides it with the sandbox name.
      SEED_BASE: '{{.SEED_BASE | default "dev_dbt_demo"}}'
    cmds:
      # Data, not structure, so this stays imperative: DCM has no COPY INTO. The
      # table schemas themselves are declared in
      # dcm/sources/definitions/raw_tables.sql.
      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/seed
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          SQL_VARIABLES: 'base={{.SEED_BASE}}'

  demo-up-pdb:
    desc: Creates the DBT_PDB_USERNAME sandbox database, warehouses, and roles, then seeds the raw tables.
    preconditions:
      - sh: '[ -n "$DBT_PDB_USERNAME" ]'
        msg: "DBT_PDB_USERNAME is not set. Add it to .env/demo.env, e.g. DBT_PDB_USERNAME=dgillis"
      - sh: 'printf "%s" "$DBT_PDB_USERNAME" | grep -Eq "^[A-Za-z_][A-Za-z0-9_]*$"'
        msg: "DBT_PDB_USERNAME must be letters, digits and underscores only, not starting with a digit."
    cmds:
      - task: snowflake-resources-up
        vars:
          DCM_TARGET: DBT_PDB
          DCM_IDENTIFIER: 'util.dcm_project_archive.dbt_demo_pdb_$DBT_PDB_USERNAME'
          # admin_users is overridden alongside base because the sandbox is named
          # after its owner, so that person is exactly who should hold its data
          # engineer role. The manifest ships DBT_PDB with admin_users: [] on
          # purpose -- a checked-in name would grant one developer access to every
          # other developer's sandbox -- so the grant has to come from the same
          # runtime value that names the objects. Without it the sandbox roles
          # exist but are assigned to nobody, and local dbt cannot reach the
          # database at all.
          DCM_VARIABLES: '-D "base=''dbt_pdb_$DBT_PDB_USERNAME''" -D "admin_users=[''$DBT_PDB_USERNAME'']"'
          DCM_ALIAS: 'pdb_up'

      - task: seed-raw-source-tables
        vars:
          SEED_BASE: 'dbt_pdb_$DBT_PDB_USERNAME'

      # The marts all call utilities.udf_generate_surrogate_key, so a sandbox
      # without these two UDFs fails on the first model. demo-up-dev creates them
      # for dev; this does the same for the sandbox, into the sandbox's own
      # utilities schema.
      - task: dbt:create-udf-concatenate-object-values
        vars:
          TARGET: pdb-keypair-auth
          ARGS: '{database: dbt_pdb_$DBT_PDB_USERNAME, schema: utilities}'
      - task: dbt:create-udf-generate-surrogate-key
        vars:
          TARGET: pdb-keypair-auth
          ARGS: '{database: dbt_pdb_$DBT_PDB_USERNAME, schema: utilities}'

  demo-up-dev:
    desc: |
      Usage: `task demo-up` if using the default demo.env file. Use `DOTENV_FILENAME=custom.env task demo-up`
      if using a custom .env file (filename does not have to be custom.env, but must end with .env).

    cmds:
      - task: snowflake-resources-up
      - task: seed-raw-source-tables
      - task: dbt:create-udf-concatenate-object-values
        vars:
          TARGET: dev-keypair-auth
          ARGS: '{database: dev_dbt_demo, schema: utilities}'
      - task: dbt:create-udf-generate-surrogate-key
        vars:
          TARGET: dev-keypair-auth
          ARGS: '{database: dev_dbt_demo, schema: utilities}'

  demo-up-prod:
    desc: Reconciles the prod_dbt_demo database, warehouses, and roles. No data seeding.
    cmds:
      - task: snowflake-resources-up
        vars:
          DCM_TARGET: PROD

  demo-teardown-pdb:
    desc: Purges the DBT_PDB_USERNAME sandbox and unregisters its DCM project. Irreversible.
    preconditions:
      - sh: '[ -n "$DBT_PDB_USERNAME" ]'
        msg: "DBT_PDB_USERNAME is not set. Add it to .env/demo.env, e.g. DBT_PDB_USERNAME=dgillis"
      - sh: 'printf "%s" "$DBT_PDB_USERNAME" | grep -Eq "^[A-Za-z_][A-Za-z0-9_]*$"'
        msg: "DBT_PDB_USERNAME must be letters, digits and underscores only, not starting with a digit."
    cmds:
      # Scoped to one sandbox's project object, so this cannot touch another
      # developer's sandbox, the shared dev database, or prod.
      - task: snowflake-resources-teardown
        vars:
          DCM_TARGET: DBT_PDB
          DCM_IDENTIFIER: 'util.dcm_project_archive.dbt_demo_pdb_$DBT_PDB_USERNAME'

  demo-teardown-dev:
    desc: Tears down all Snowflake resources created for the dbt demo.
    cmds:
      - task: snowflake-resources-teardown
      - task: dcm-home-teardown

  snowflake-resources-teardown:
    desc: Purges every object managed by the DCM target, then unregisters the project.
    internal: true
    cmds:
      - task: validate-prerequisites:snowcli
      # purge derives the object list from the same definitions the deploy used,
      # so teardown can no longer drift from init the way sql/teardown did.
      #
      # Note purge takes no --variable flag, so the DBT_PDB sandbox is identified
      # by its project object alone. That is sufficient: purge drops what the
      # project currently manages, which is recorded in the project's own state.
      - task: snow-cli:dcm-purge
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DCM_TARGET: '{{.DCM_TARGET | default "DEV"}}'
          DCM_IDENTIFIER: '{{.DCM_IDENTIFIER | default ""}}'
      # purge leaves the project registration behind; drop removes the metadata.
      - task: snow-cli:dcm-drop
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DCM_TARGET: '{{.DCM_TARGET | default "DEV"}}'
          DCM_IDENTIFIER: '{{.DCM_IDENTIFIER | default ""}}'

  demo-teardown-prod:
    desc: Purges the prod_dbt_demo resources and unregisters the prod DCM project.
    cmds:
      - task: snowflake-resources-teardown
        vars:
          DCM_TARGET: PROD

  dcm-home-teardown:
    desc: Drops the schema holding the dbt demo's DCM project objects.
    internal: true
    cmds:
      # Schema only, never the database. util is shared and predates this demo.
      #
      # util.dbt_project_archive is deliberately left alone: the DBT PROJECT
      # object there accumulates a version history across deploys, and there is
      # no reason to lose it because the databases it builds into were rebuilt.
      #
      # This removes the registrations for ALL THREE targets, including every
      # developer's personal sandbox. If PROD or any sandbox was ever deployed,
      # run `task demo-teardown-prod` / `task demo-teardown-pdb` first, or those
      # objects are orphaned with nothing left to manage them.
      - task: snow-cli:drop-schema-if-exists
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          SCHEMA_FQN: util.dcm_project_archive

  dbt-build-marts:
    desc: Builds the marts dimensions and their upstream models locally. Local counterpart of dbt-project-run-marts.
    cmds:
      # Thin wrapper over the namespaced task so the local entrypoint reads
      # symmetrically with dbt-project-run-marts below. Same selection, same
      # exclusions; the only difference is where dbt itself executes.
      - task: dbt:build-dimensions
        vars:
          DBT_TARGET: '{{.DBT_TARGET | default "dev-tastyb"}}'

  dbt-project-deploy:
    desc: Stages and deploys the dbt project object to Snowflake (adds a new version if it exists).
    cmds:
      - task: validate-prerequisites:snowcli
      - task: dbt-projects:deploy-dbt-project
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME

  dbt-project-compile:
    desc: Compiles the deployed project object. Cheap way to validate profiles.yml, env.yml, and refs before building.
    cmds:
      - task: dbt-projects:execute-dbt-project
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME
          DBT_WAREHOUSE: '{{.DBT_WAREHOUSE | default "dev_dbt_demo_s_wh"}}'
          DBT_ENVIRONMENT: '{{.DBT_ENVIRONMENT | default "dev"}}'
          DBT_ARGS: 'compile --target dev'

  dbt-project-run-country-dimension:
    desc: Builds d_country and its upstream staging view on Snowflake. Counterpart of dbt:build-country-dimension.
    cmds:
      - task: dbt-projects:execute-dbt-project
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME
          DBT_WAREHOUSE: '{{.DBT_WAREHOUSE | default "dev_dbt_demo_s_wh"}}'
          DBT_ENVIRONMENT: '{{.DBT_ENVIRONMENT | default "dev"}}'
          # The narrowest useful build: 2 models, stg_pos__country and d_country.
          # Same selection as dbt:build-country-dimension, and with ENVIRONMENT=dev
          # the same two relations, so the local and remote paths are comparable.
          DBT_ARGS: 'build --select +d_country --target dev'

  dbt-project-run-marts:
    desc: Builds the models/marts dimensions and their upstream staging views, with tests.
    cmds:
      - task: dbt-projects:execute-dbt-project
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME
          DBT_WAREHOUSE: '{{.DBT_WAREHOUSE | default "dev_dbt_demo_s_wh"}}'
          DBT_ENVIRONMENT: '{{.DBT_ENVIRONMENT | default "dev"}}'
          # +path:models/marts pulls in the 8 upstream staging views (cheap).
          # The two fact tables are excluded: they are 248M and 673M rows and
          # are built by dbt-project-run-facts on a larger warehouse.
          DBT_ARGS: 'build --select +path:models/marts --exclude f_order f_order_line --target dev'

  dbt-project-run-marts-dev-user:
    desc: Builds the marts into your OWN schema, named after your Snowflake user, instead of the shared modeled schema.
    cmds:
      - task: dbt-projects:execute-dbt-project
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME
          DBT_WAREHOUSE: '{{.DBT_WAREHOUSE | default "dev_dbt_demo_s_wh"}}'
          DBT_ENVIRONMENT: 'dev_user'
          DBT_ARGS: 'build --select +path:models/marts --exclude f_order f_order_line --target dev'

  dbt-project-run-facts:
    desc: Builds f_order (248M rows) and f_order_line (673M rows) on a larger warehouse. Expensive, opt-in.
    cmds:
      - task: dbt-projects:execute-dbt-project
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME
          DBT_WAREHOUSE: '{{.DBT_FACTS_WAREHOUSE | default "dev_dbt_demo_xl_wh"}}'
          DBT_ENVIRONMENT: '{{.DBT_ENVIRONMENT | default "dev"}}'
          # ENV_VARS takes final precedence over env.yml, so the run uses the
          # larger warehouse without editing the file. Keep this aligned with
          # DBT_WAREHOUSE above so only one warehouse wakes up.
          DBT_ENV_VARS: "'DBT_CURRENT_WH' = '{{.DBT_FACTS_WAREHOUSE | default \"dev_dbt_demo_xl_wh\"}}'"
          DBT_ARGS: 'run --select f_order f_order_line --target dev'

  pat-create:
    desc: Mints the dev_dbt_demo_pat token and exports it as DBT_ENV_SECRET_PAT in ~/.zshrc.
    cmds:
      - task: validate-prerequisites:snowcli
      - task: snow-cli:create-pat
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          PAT_USER: '{{.PAT_USER | default "tastyb"}}'
          PAT_NAME: '{{.PAT_NAME | default "dev_dbt_demo_pat"}}'
          PAT_ROLE_RESTRICTION: '{{.PAT_ROLE_RESTRICTION | default "dev_dbt_demo_data_engineer"}}'
          PAT_DAYS_TO_EXPIRY: '{{.PAT_DAYS_TO_EXPIRY | default "90"}}'
          # Empty means the script falls back to $HOME/.zshrc.
          SHELL_RC_FILE: '{{.SHELL_RC_FILE | default ""}}'

  # -----------------------------------------------------------------------
  # Observability
  #
  # Runs inside Snowflake emit OpenTelemetry logs and trace spans to the account
  # event table. Enabled by the telemetry block in
  # tasks/snow-cli/sql/bootstrap/001-create_util_database.sql, which task
  # util-database-up applies; if these tasks return nothing, that is the first
  # thing to check.
  #
  # Every task here reads the MOST RECENT run of the project object and resolves
  # that run itself, so none of them need a query id. See docs/dev-loop.md for the
  # walkthrough.
  #
  # Expect a lag of up to 10 seconds between an event happening and it being
  # queryable. Reading logs the instant a run returns can come back short.
  # -----------------------------------------------------------------------

  dbt-project-logs:
    desc: Shows the log output of the most recent dbt project run.
    cmds:
      - task: dbt-projects:telemetry-last-run-logs
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME
          ROW_LIMIT: '{{.ROW_LIMIT | default "500"}}'

  dbt-project-logs-errors:
    desc: Shows only errors and warnings from the most recent dbt project run.
    cmds:
      # Same task body as dbt-project-logs, pointed at the filtered query. A full
      # build emits several hundred INFO lines, so this is the usable view when
      # something has actually broken.
      - task: dbt-projects:telemetry-last-run-logs
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME
          TELEMETRY_SQL: sql/telemetry-last-run-errors.sql
          ROW_LIMIT: '{{.ROW_LIMIT | default "500"}}'

  dbt-project-spans:
    desc: Shows per-step trace timings from the most recent dbt project run, slowest first.
    cmds:
      # The reason TRACE_LEVEL is set to ALWAYS. Logs say what happened; spans say
      # how long each step took.
      - task: dbt-projects:telemetry-last-run-logs
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME
          TELEMETRY_SQL: sql/telemetry-last-run-spans.sql
          ROW_LIMIT: '{{.ROW_LIMIT | default "100"}}'

  dbt-project-run-marts-tailed:
    desc: Runs the marts build asynchronously and streams its log output while it executes.
    cmds:
      # Same selection as dbt-project-run-marts, submitted asynchronously so the
      # logs can be followed live instead of arriving in one block at the end.
      #
      # Caveat worth knowing: `snow dbt execute` on CLI 3.24.1 cannot pass
      # ENVIRONMENT, so this run uses env.yml's default_environment (dev) and
      # cannot target dev_user or prod. For those, use the regular
      # dbt-project-run-* task and read the logs afterwards with
      # `task dbt-project-logs`.
      - task: dbt-projects:tail-dbt-project-run
        vars:
          CLI_CONNECTION_NAME: $CLI_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME
          DBT_WAREHOUSE: '{{.DBT_WAREHOUSE | default "dev_dbt_demo_s_wh"}}'
          DBT_ARGS: 'build --select +path:models/marts --exclude f_order f_order_line --target dev'
