version: '3'

includes:
  validate-prerequisites: ./tasks/validate-prerequisites/validate-prerequisite-tasks.yml
  snow-cli:
    taskfile: ./tasks/snow-cli/snowcli-tasks.yml
    dir: ./tasks/snow-cli
  dbt-projects:
    taskfile: ./tasks/snow-cli/dbt-projects/dbt-projects-tasks.yml
    dir: ./tasks/snow-cli/dbt-projects
  dbt:
    taskfile: ./tasks/dbt/dbt-tasks.yml

env:
  ENV_DIR: .env

dotenv: ['{{ .ENV_DIR }}/{{ .DOTENV_FILENAME | default "demo.env" }}']

tasks:

  snowflake-resources-up:
    desc: Validates Snowflake CLI, bootstraps the util database, then reconciles all infrastructure.
    internal: true
    requires:
      vars: [DCM_TARGET, DCM_VARIABLES]
    cmds:
      - task: validate-prerequisites:snowcli
      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/bootstrap
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
      - task: snow-cli:dcm-create
        vars:
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          DCM_TARGET: '{{.DCM_TARGET}}'
      - task: snow-cli:dcm-deploy
        vars:
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          DCM_TARGET: '{{.DCM_TARGET}}'
          DCM_VARIABLES: '{{.DCM_VARIABLES}}'
          DCM_ALIAS: '{{.DCM_ALIAS | default "initial deployment"}}'

  snowflake-resources-teardown:
    desc: Purges every object managed by the DCM target, then unregisters the project.
    internal: true
    requires:
      vars: [DCM_TARGET]
    cmds:
      - task: validate-prerequisites:snowcli

      - task: snow-cli:dcm-purge
        vars:
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          DCM_TARGET: '{{.DCM_TARGET}}'

      - task: snow-cli:dcm-drop
        vars:
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          DCM_TARGET: '{{.DCM_TARGET}}'

  seed-raw-source-tables:
    desc: Loads any RAW source table that is empty by COPY INTO from the public Tasty Bytes S3 bucket.
    internal: true
    requires:
      vars: [SEED_BASE]
    cmds:
      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/seed
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          SQL_VARIABLES: 'base={{.SEED_BASE}}'

  grant-dbt-project-execution:
    desc: Grants the sandbox's data engineer role the privileges to run the deployed dbt project object.
    internal: true
    requires:
      vars: [GRANT_BASE]
    cmds:
      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/dbt-project-grants
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          SQL_VARIABLES: >-
            base={{.GRANT_BASE}}
            dbt_project_database=$DBT_PROJECT_DATABASE
            dbt_project_schema=$DBT_PROJECT_SCHEMA
            dbt_project_object_name=$DBT_PROJECT_OBJECT_NAME

  demo-up-pdb:
    desc: Creates the DBT_PDB_USERNAME sandbox database, warehouses, and roles, then seeds the raw tables.
    preconditions:
      - sh: '[ -n "$DBT_PDB_USERNAME" ]'
        msg: "DBT_PDB_USERNAME is not set. Add it to .env/demo.env, e.g. DBT_PDB_USERNAME=dgillis"
      - sh: 'printf "%s" "$DBT_PDB_USERNAME" | grep -Eq "^[A-Za-z_][A-Za-z0-9_]*$"'
        msg: "DBT_PDB_USERNAME must be letters, digits and underscores only, not starting with a digit."
    cmds:
      - task: snowflake-resources-up
        vars:
          DCM_TARGET: DBT_PDB_DGILLIS
          DCM_VARIABLES: '-D "base=''dbt_pdb_$DBT_PDB_USERNAME''" -D "admin_users=[''$DBT_PDB_USERNAME'']"'
          DCM_ALIAS: 'Initial deployment'

      - task: seed-raw-source-tables
        vars:
          SEED_BASE: 'dbt_pdb_$DBT_PDB_USERNAME'

      - task: grant-dbt-project-execution
        vars:
          GRANT_BASE: 'dbt_pdb_$DBT_PDB_USERNAME'

  demo-up-prod:
    desc: Creates the PROD database, warehouses, and roles, then seeds the raw tables.
    cmds:
      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/prod-ci-cd-step-1
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          SQL_VARIABLES: 'base=dbt_prod'

      - task: snowflake-resources-up
        vars:
          DCM_TARGET: PROD
          DCM_IDENTIFIER: 'util.dcm_project_archive.dbt_prod'
          DCM_ALIAS: 'Initial PROD deployment'
          DCM_VARIABLES:

#      - task: seed-raw-source-tables
#        vars:
#          SEED_BASE: 'dbt_prod'

      - task: snow-cli:sort-and-process-sql-folder
        vars:
          SQL_SORT_PROCESS_DIR: sql/prod-ci-cd-step-2
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          SQL_VARIABLES: 'base=dbt_prod'

  demo-teardown-pdb:
    desc: Purges the DBT_PDB_USERNAME sandbox and unregisters its DCM project. Irreversible.
    preconditions:
      - sh: '[ -n "$DBT_PDB_USERNAME" ]'
        msg: "DBT_PDB_USERNAME is not set. Add it to .env/demo.env, e.g. DBT_PDB_USERNAME=dgillis"
      - sh: 'printf "%s" "$DBT_PDB_USERNAME" | grep -Eq "^[A-Za-z_][A-Za-z0-9_]*$"'
        msg: "DBT_PDB_USERNAME must be letters, digits and underscores only, not starting with a digit."
    cmds:
      # Scoped to one sandbox's project object, so this cannot touch another
      # developer's sandbox, the shared dev database, or prod.
      - task: snowflake-resources-teardown
        vars:
          DCM_TARGET: DBT_PDB_DGILLIS

  demo-teardown-prod:
    desc: Purges the prod_dbt_demo resources and unregisters the prod DCM project.
    cmds:
      - task: snowflake-resources-teardown
        vars:
          DCM_TARGET: PROD

  dcm-home-teardown:
    desc: "ACCOUNT-WIDE: drops the shared schema holding EVERY target's DCM project registration."
    cmds:
      - task: snow-cli:drop-schema-if-exists
        vars:
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          SCHEMA_FQN: util.dcm_project_archive

  dbt-project-deploy:
    desc: Stages and deploys the dbt project object to Snowflake (adds a new version if it exists).
    cmds:
      - task: validate-prerequisites:snowcli
      - task: dbt-projects:deploy-dbt-project
        vars:
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME

  dbt-project-execute:
    desc: Runs a dbt command on the deployed project object against the caller's sandbox.
    internal: true
    preconditions:
      - sh: '[ -n "$DBT_PDB_USERNAME" ]'
        msg: "DBT_PDB_USERNAME is not set. Add it to .env/demo.env, e.g. DBT_PDB_USERNAME=dgillis"
      - sh: 'printf "%s" "$DBT_PDB_USERNAME" | grep -Eq "^[A-Za-z_][A-Za-z0-9_]*$"'
        msg: "DBT_PDB_USERNAME must be letters, digits and underscores only, not starting with a digit."
    cmds:
      - task: dbt-projects:execute-dbt-project
        vars:
          # NOT SNOW_CLI_ADMIN_CONNECTION_NAME. Execution runs as the sandbox owner over a
          # role-restricted PAT, which is also what makes env.yml's CURRENT_USER()
          # resolve to this sandbox rather than to an admin's username.
          SNOW_CLI_ADMIN_CONNECTION_NAME: $DBT_EXEC_CONNECTION_NAME
          DBT_PROJECT_DATABASE: $DBT_PROJECT_DATABASE
          DBT_PROJECT_SCHEMA: $DBT_PROJECT_SCHEMA
          DBT_PROJECT_OBJECT_NAME: $DBT_PROJECT_OBJECT_NAME
          DBT_WAREHOUSE: '{{.DBT_WAREHOUSE | default "dbt_pdb_${DBT_PDB_USERNAME}_s_wh"}}'
          DBT_ENVIRONMENT: '{{.DBT_ENVIRONMENT | default "dbt_pdb"}}'
          DBT_ARGS: '{{.DBT_ARGS}}'
          DBT_ENV_VARS: '{{.DBT_ENV_VARS | default ""}}'

  dbt-project-compile:
    desc: Compiles the deployed project object. Cheap way to validate profiles.yml, env.yml, and refs before building.
    cmds:
      - task: dbt-project-execute
        vars:
          DBT_ARGS: 'compile --target dbt_pdb'

  dbt-project-run-country-dimension:
    desc: Builds d_country and its upstream staging view on Snowflake. Counterpart of dbt:build-country-dimension.
    cmds:
      - task: dbt-project-execute
        vars:
          DBT_ARGS: 'build --select +d_country --target dbt_pdb'

  dbt-project-run-marts:
    desc: Builds the models/marts dimensions and their upstream staging views, with tests.
    cmds:
      - task: dbt-project-execute
        vars:
          DBT_ARGS: 'build --select +path:models/marts --exclude f_order f_order_line --target dbt_pdb'

  dbt-project-run-facts:
    desc: Builds f_order (248M+ rows) and f_order_line (673M+ rows) on a larger warehouse. Expensive, opt-in.
    vars:
      DBT_FACTS_WAREHOUSE: '{{.DBT_FACTS_WAREHOUSE | default "dbt_pdb_${DBT_PDB_USERNAME}_xl_wh"}}'
    cmds:
      - task: dbt-project-execute
        vars:
          DBT_WAREHOUSE: '{{.DBT_FACTS_WAREHOUSE}}'
          DBT_ENV_VARS: "'DBT_CURRENT_WH' = '{{.DBT_FACTS_WAREHOUSE}}'"
          DBT_ARGS: 'run --select f_order f_order_line --target dbt_pdb'

  pat-create:
    desc: Mints the dbt_pdb_tastyb_pat token and exports it as DBT_ENV_SECRET_PAT in ~/.zshrc.
    vars:
      RC_FILE_DISPLAY: '{{.SHELL_RC_FILE | default "~/.zshrc"}}'
    cmds:
      - task: validate-prerequisites:snowcli
      - task: snow-cli:create-pat
        vars:
          SNOW_CLI_ADMIN_CONNECTION_NAME: $SNOW_CLI_ADMIN_CONNECTION_NAME
          PAT_USER: '{{.PAT_USER | default "tastyb"}}'
          PAT_NAME: '{{.PAT_NAME | default "dbt_pdb_tastyb_pat"}}'
          PAT_ROLE_RESTRICTION: '{{.PAT_ROLE_RESTRICTION | default "dbt_pdb_tastyb_data_engineer"}}'
          PAT_DAYS_TO_EXPIRY: '{{.PAT_DAYS_TO_EXPIRY | default "90"}}'
          SHELL_RC_FILE: '{{.SHELL_RC_FILE | default ""}}'

      - cmd: |
          printf '\n%s\n' "NOTE: this shell still holds the PREVIOUS DBT_ENV_SECRET_PAT."
          printf '%s\n'   "      The new token is only in {{.RC_FILE_DISPLAY}}, so dbt runs started"
          printf '%s\n'   "      from this shell keep using the old one and fail to authenticate."
          printf '%s\n\n' "      Open a new shell, or: source {{.RC_FILE_DISPLAY}}"
        silent: true
