name: Incoming PR
run-name: PR opened by ${{ github.actor }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write # Required to post the run summary comment.

# Serialize runs within a single pull request.
#
# Caveat: cancellation stops the runner, so a cancelled run leaves its clone
# behind. The next run's CREATE OR REPLACE reclaims it and pr_cleanup.yml drops
# it when the PR closes, so this self-heals -- but the clone does hold storage
# until one of those happens.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run-snowflake-test-dbt-job:
    name: "Run on Incoming PR"
    runs-on: ubuntu-latest
    environment: prod # Must match the OIDC subject's environment
    env:
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      # SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }} # Required if you aren't using OIDC
      # SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PAT }} # Snowflake password is required if you aren't using OIDC
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      # Only selects where `snow dbt deploy` puts its temporary upload stage.
      # The database and schema the models are actually built into come from
      # env.yml by way of dbt_projects_profiles.yml, not from here.
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}

      # Every per-PR object is named off the PR number so that concurrent PRs
      # cannot collide. dbt project objects allow only one concurrent execution
      # per object, so a shared tester name would serialize -- or fail -- once
      # two PRs are open at the same time.
      CI_DATABASE: dbt_ci_pr_${{ github.event.pull_request.number }}
      CI_DBT_PROJECT: ${{ vars.DBT_PROJECT_DATABASE }}.${{ vars.DBT_PROJECT_SCHEMA }}.tester_tasty_bytes_pr_${{ github.event.pull_request.number }}

    steps:
      # Check out repository code
      # Gets the latest code from the incoming pull request
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with: # Ensures Snowflake CLI will search for OIDC users matching this subject
          use-oidc: true

      - name: Check Snowflake CLI Version
        run: snow --version

      # The -x is shorthand for --temporary-connection
      - run: snow connection test -x

      # -------------------------------------------------------------------
      # Isolation: build into a zero-copy clone of production, never prod.
      #
      # Cloning a database carries the grants on its child schemas and tables,
      # but NOT the grants on the database object itself. So USAGE and
      # CREATE SCHEMA have to be re-granted to the access role that
      # dbt_prod_data_engineer inherits, or dbt cannot resolve the database.
      # -------------------------------------------------------------------
      - name: Clone ${{ vars.SNOWFLAKE_DATABASE }} into ${{ env.CI_DATABASE }}
        run: |
          snow sql -x --role ACCOUNTADMIN --query "
            CREATE OR REPLACE DATABASE ${CI_DATABASE}
              CLONE ${SNOWFLAKE_DATABASE}
              COMMENT = 'Ephemeral CI clone for PR #${{ github.event.pull_request.number }}. Dropped when the PR closes.';
            GRANT USAGE, CREATE SCHEMA ON DATABASE ${CI_DATABASE} TO ROLE dbt_prod_rw;
            GRANT USAGE ON DATABASE ${CI_DATABASE} TO ROLE dbt_prod_ro;
          "

      # --default-env prod is required here, not cosmetic.
      #
      # `snow dbt deploy` COMPILES the project as part of deploying it, and
      # compilation resolves env.yml. With no environment named, the deploy falls
      # through to default_environment, which is dbt_pdb, and that resolves
      # DBT_CURRENT_DB to 'dbt_pdb_' || CURRENT_USER() -- for the CI service
      # account that is dbt_pdb_GITHUB_ACTIONS_SERVICE_USER, which does not
      # exist. Observed as run 33409888887:
      #   "DBT job failed with exception: Failed to use database
      #    dbt_pdb_GITHUB_ACTIONS_SERVICE_USER: Object does not exist"
      #
      # `ci` is not usable here either: its DBT_CURRENT_DB is deliberately a
      # database that does not exist, so compilation would fail the same way.
      # That sentinel is only safe alongside the --env-vars override that the
      # execute step supplies; it was never viable for a deploy-time compile.
      #
      # So compilation resolves against prod, which exists and is only read for
      # metadata at this stage -- a deploy builds no models. The build itself is
      # redirected onto the clone by --env ci plus --env-vars below, which are
      # highest precedence and override this default. merge_main.yml passes the
      # same flag, which is why CD kept working while this step did not.
      - name: Deploy PR-scoped dbt project object ${{ env.CI_DBT_PROJECT }}
        run: |
          snow dbt deploy "${CI_DBT_PROJECT}" -x \
            --dbt-version 1.11.11 \
            --external-access-integration dbt_deps_ext_access \
            --default-env prod

      # -------------------------------------------------------------------
      # Build and test the mart layer against the clone.
      #
      # Argument order is important. Everything after the dbt# (`build`) command
      # is forwarded verbatim to dbt, so every Snowflake CLI flag has
      # to precede the project name. Moving --env after `build` would hand it
      # to dbt, which does not recognise it.
      # -------------------------------------------------------------------
      - name: Build and test dbt project in ${{ env.CI_DATABASE }}
        run: |
          snow dbt execute -x \
            --dbt-version 1.11.11 \
            --env ci \
            --env-vars "{\"DBT_CURRENT_DB\": \"${CI_DATABASE}\"}" \
            --format json \
            "${CI_DBT_PROJECT}" build \
            --select +path:models/marts \
            --exclude f_order f_order_line \
            --target prod | tee dbt_run.json

      # -------------------------------------------------------------------
      # Infrastructure drift check.
      #
      # --save-output writes tasks/snow-cli/out/plan_result.json. That file is
      # surfaced as an artifact rather than relying on the printed table,
      # because DCM models grants as a nested property of the grantee role and
      # the printed summary therefore under-reports grant changes.
      # -------------------------------------------------------------------
      - name: Plan DCM infrastructure changes (no-op check)
        working-directory: tasks/snow-cli
        run: |
          snow dcm plan util.dcm_project_archive.dbt_prod -x \
            --role ACCOUNTADMIN \
            --from dcm \
            --target PROD \
            --save-output

      - name: Upload build and plan artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-artifacts-pr-${{ github.event.pull_request.number }}
          path: |
            dbt_run.json
            tasks/snow-cli/out/plan_result.json
          if-no-files-found: warn

      - name: Comment run summary on PR
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const outcome = '${{ job.status }}';
            const body = [
              `### dbt CI — ${outcome === 'success' ? 'passed' : 'failed'}`,
              '',
              `| | |`,
              `|---|---|`,
              `| Isolated database | \`${{ env.CI_DATABASE }}\` (clone of \`${{ vars.SNOWFLAKE_DATABASE }}\`) |`,
              `| dbt project object | \`${{ env.CI_DBT_PROJECT }}\` |`,
              `| Selection | \`build --select +path:models/marts --exclude f_order f_order_line\` |`,
              `| DCM plan | \`util.dcm_project_archive.dbt_prod\` target \`PROD\` |`,
              '',
              `Production was not written to. The clone and the dbt project object are dropped when this PR closes.`,
              '',
              `[Run details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
