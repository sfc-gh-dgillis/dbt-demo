version: '3'

tasks:

  sort-and-process-sql-folder:
    desc: Sorts and processes all SQL files in the given directory. Sorts and executes SQL files with numeric prefixes (e.g., 001-schema.sql)
    internal: true
    vars:
      # Optional snow sql template variables, as space-separated KEY=value pairs.
      # The SQL files reference them as <% KEY %>. Empty for callers whose SQL is
      # fully literal, such as sql/bootstrap.
      SQL_VARIABLES: '{{.SQL_VARIABLES | default ""}}'
    cmds:
      - python3 pyutil/snowclisp/snowclisp.py "{{.SQL_SORT_PROCESS_DIR}}" "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}" {{.SQL_VARIABLES}}

  upload-files-to-internal-named-stage:
    desc: Uploads all files from the given directory to a Snowflake Internal stage using the Snowflake CLI and PUT command.
    internal: true
    cmds:
      - python3 pyutil/snowcliput/snowcliput.py "{{.FILE_UPLOAD_DIR}}" "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}" "{{.INTERNAL_NAMED_STAGE}}"

  drop-database-if-exists:
    desc: Drops the specified Snowflake database if it exists using the Snowflake CLI.
    internal: true
    cmds:
      - snow sql --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}" --query "DROP DATABASE IF EXISTS {{.DEMO_DATABASE_NAME}};"

  drop-schema-if-exists:
    desc: Drops the specified Snowflake schema if it exists using the Snowflake CLI.
    internal: true
    cmds:
      - snow sql --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}" --query "DROP SCHEMA IF EXISTS {{.SCHEMA_FQN}};"

  create-pat:
    desc: Mints a programmatic access token and exports it from the shell rc file.
    internal: true
    cmds:
      # Wrapped in a script rather than inlined here because the token secret is
      # returned exactly once, by the create statement itself, and has to be
      # parsed out and written to the rc file without ever reaching a log or argv.
      - >-
        cmd/create-pat.sh
        "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}"
        "{{.PAT_USER}}"
        "{{.PAT_NAME}}"
        "{{.PAT_ROLE_RESTRICTION}}"
        "{{.PAT_DAYS_TO_EXPIRY}}"
        "{{.SHELL_RC_FILE}}"

  # -----------------------------------------------------------------------
  # DCM (Database Change Management)
  #
  # The demo's Snowflake infrastructure (databases, schemas, warehouses, roles,
  # and grants) is declared in dcm/sources/definitions and reconciled by DCM.
  # These replace the old imperative sql/init and sql/teardown scripts.
  #
  # Every command below pins --role ACCOUNTADMIN rather than inheriting whatever
  # role the connection happens to default to. DCM models each managed object as
  # an OWNERSHIP grant to the executing role, so the role is not incidental: it
  # decides who owns the database, warehouses, and roles that get created. A run
  # under a different role would either fail for lack of privilege or, worse,
  # succeed and leave objects owned by the wrong role, which then shows up later
  # as an ALTER in the plan or as an "Insufficient privileges ... must have
  # OWNERSHIP" error. It also matches project_owner: ACCOUNTADMIN in the manifest.
  #
  # The bootstrap SQL does not need this: sql/bootstrap/001-create_util_database.sql
  # already opens with `USE ROLE accountadmin`.
  #
  # DCM_TARGET selects a target from dcm/manifest.yml, which bundles the project
  # identifier with its templating configuration. PROD manages dbt_demo_prod and
  # its warehouses and roles; DBT_PDB manages a per-developer sandbox. There is no
  # default: the manifest defines no default_target, and every caller passes one.
  #
  # Two optional overrides support the DBT_PDB per-developer sandbox target, whose
  # object names are not known until run time. Both default to empty, so the
  # PROD command line is unchanged:
  #
  #   DCM_IDENTIFIER  a fully qualified DCM project object name, passed positionally.
  #                   It takes precedence over the target's project_name, which is
  #                   how each developer's sandbox gets its own project
  #                   registration without a target per person.
  #
  #   DCM_VARIABLES   extra flags for the templating context, e.g.
  #                   -D "base='dbt_pdb_dgillis'". Runtime --variable is the
  #                   highest tier of DCM's variable resolution, overriding both
  #                   templating.defaults and the target's configuration.
  #
  # Note only plan and deploy accept --variable. create, purge, and drop do not,
  # so they take the identifier alone.
  # -----------------------------------------------------------------------

  dcm-create:
    desc: Registers the DCM project object in Snowflake if it does not already exist.
    internal: true
    vars:
      DCM_PROJECT_DIR: '{{.DCM_PROJECT_DIR | default "dcm"}}'
      DCM_TARGET: '{{.DCM_TARGET}}'
    cmds:
      - >-
        snow dcm create
        --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}"
        --role ACCOUNTADMIN
        --from "{{.DCM_PROJECT_DIR}}"
        --target "{{.DCM_TARGET}}"
        --if-not-exists

  dcm-plan:
    desc: Shows what DCM would create, alter, or drop for a target. Applies nothing.
    internal: true
    vars:
      DCM_PROJECT_DIR: '{{.DCM_PROJECT_DIR | default "dcm"}}'
      DCM_TARGET: '{{.DCM_TARGET}}'
      DCM_IDENTIFIER: '{{.DCM_IDENTIFIER}}'
      DCM_VARIABLES: '{{.DCM_VARIABLES | default ""}}'
    cmds:
      # --save-output writes out/plan_result.json. Grants do not appear in the
      # printed summary because DCM models them as a nested property of the
      # grantee role, so that file is the only way to review grant changes.
      - >-
        snow dcm plan {{.DCM_IDENTIFIER}}
        --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}"
        --role ACCOUNTADMIN
        --from "{{.DCM_PROJECT_DIR}}"
        --target "{{.DCM_TARGET}}"
        --save-output
        {{.DCM_VARIABLES}}

  dcm-deploy:
    desc: Reconciles Snowflake with the DCM definitions for a target.
    internal: true
    requires:
      vars: [DCM_TARGET, DCM_VARIABLES]
    vars:
      DCM_PROJECT_DIR: '{{.DCM_PROJECT_DIR | default "dcm"}}'
      DCM_TARGET: '{{.DCM_TARGET}}'
      DCM_ALIAS: '{{.DCM_ALIAS}}'
#      DCM_IDENTIFIER: '{{.DCM_IDENTIFIER}}'
      DCM_VARIABLES: '{{.DCM_VARIABLES}}'
    cmds:
      - >-
        snow dcm deploy
        --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}"
        --role ACCOUNTADMIN
        --from "{{.DCM_PROJECT_DIR}}"
        --target "{{.DCM_TARGET}}"
        --alias "{{.DCM_ALIAS}} completed on $(date +%Y%m%d_%H%M%S)"
        {{.DCM_VARIABLES}}

  dcm-purge:
    desc: Drops every Snowflake object managed by a DCM target. Irreversible.
    internal: true
    vars:
      DCM_PROJECT_DIR: '{{.DCM_PROJECT_DIR | default "dcm"}}'
      DCM_TARGET: '{{.DCM_TARGET}}'
      DCM_IDENTIFIER: '{{.DCM_IDENTIFIER}}'
    cmds:
      # Replaces sql/teardown. Because the object list is derived from the same
      # definitions the deploy used, teardown can no longer drift from init.
      # --force skips the interactive prompt; this deletes data.
      - >-
        snow dcm purge {{.DCM_IDENTIFIER}}
        --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}"
        --role ACCOUNTADMIN
        --from "{{.DCM_PROJECT_DIR}}"
        --target "{{.DCM_TARGET}}"
        --force
    # purge has no --if-exists (drop does), and against a missing project it fails
    # with "DCM Project ... does not exist or not authorized". Since purge runs
    # before drop, that alone made teardown non-idempotent. A Task `status:` that
    # succeeds means "already up to date", so inverting the existence check makes
    # this task SKIP rather than fail once the project is gone.
    status:
      - >-
        ! cmd/dcm-project-exists.sh
        "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}"
        "{{.DCM_TARGET}}"
        "{{.DCM_IDENTIFIER}}"
        "{{.DCM_PROJECT_DIR}}"

  dcm-drop:
    desc: Removes the DCM project registration. Leaves managed objects untouched.
    internal: true
    vars:
      DCM_PROJECT_DIR: '{{.DCM_PROJECT_DIR | default "dcm"}}'
      DCM_TARGET: '{{.DCM_TARGET}}'
      DCM_IDENTIFIER: '{{.DCM_IDENTIFIER}}'
    cmds:
      # Metadata only, so always run dcm-purge first if the objects should go too.
      #
      # --if-exists makes teardown re-runnable. Without it a second `task
      # demo-teardown-dev` fails here, because the first run already removed the
      # registration and drop has nothing left to remove.
      - >-
        snow dcm drop {{.DCM_IDENTIFIER}}
        --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}"
        --role ACCOUNTADMIN
        --from "{{.DCM_PROJECT_DIR}}"
        --target "{{.DCM_TARGET}}"
        --if-exists

  dcm-list:
    desc: Lists the DCM projects registered in the project home schema.
    internal: true
    cmds:
      # `snow dcm list` with no scope looks in the connection's default database
      # and schema, which is not where these projects live, so it reports
      # "No data". Query the home schema explicitly instead.
      - >-
        snow sql
        --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}"
        --query "SHOW DCM PROJECTS IN SCHEMA util.dcm_project_archive;"
