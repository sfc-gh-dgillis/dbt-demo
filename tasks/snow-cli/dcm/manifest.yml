# DCM (Database Change Management) project for the dbt demo.
#
# Replaces the old imperative sql/init and sql/teardown scripts. Every object
# below is declared, not created: DCM diffs the definitions against the account
# and issues only the CREATE / ALTER / DROP needed to converge. Re-running a
# deploy is a no-op when nothing changed.
#
# Each target owns a disjoint, prefixed set of objects, so no two targets can
# ever fight over the same account-level warehouse or role:
#
#   DEV     -> dev_dbt_demo,      dev_dbt_demo_*_wh,      dev_dbt_demo_{rw,ro,...}
#   PROD    -> prod_dbt_demo,     prod_dbt_demo_*_wh,     prod_dbt_demo_{rw,ro,...}
#   DBT_PDB -> dbt_pdb_<user>,    dbt_pdb_<user>_*_wh,    dbt_pdb_<user>_{rw,ro,...}
#
# DBT_PDB is a per-developer sandbox: a full, private copy of the DEV stack named
# after the Snowflake user who deploys it, e.g. DBT_PDB_DGILLIS. Unlike the
# `dev_user` environment in env.yml -- which gives a developer their own SCHEMA
# inside the shared dev_dbt_demo -- this gives them their own DATABASE, warehouse
# fleet, and roles, so nothing they do can touch a shared object.
#
# It is not a Snowflake Personal Database (USER$<USERNAME>). It only borrows the
# naming idea. DCM cannot manage objects in a real PDB at all: PDB schemas are
# owned by a USER rather than a role, and DCM models every object it manages as a
# role OWNERSHIP grant, so `DEFINE SCHEMA "USER$DGILLIS".X` fails with an internal
# error. Tables are impossible in a PDB regardless. Hence a regular database that
# merely reads as personal.
#
# Both the object prefix and the project object name for DBT_PDB come from the
# DBT_PDB_USERNAME environment variable in .env/demo.env, injected by the task
# layer -- see the DBT_PDB configuration below for why the values checked in here
# are deliberate dummies.
#
# The project object itself lives in util.dcm_project_archive, which is created by
# sql/bootstrap/001-create_util_database.sql. It cannot live in the databases this
# project manages: a DCM project may not define its own parent database or
# schema.
#
# Usage:
#   task dcm-plan                 preview the DEV changeset
#   task demo-up                  bootstrap + deploy DEV + seed raw tables
#   task demo-up-prod             deploy PROD
#   task dcm-plan-pdb             preview YOUR personal sandbox changeset
#   task demo-up-pdb              deploy YOUR personal sandbox (no data seeding)
#   task demo-teardown            purge every managed object, drop the project
#   task demo-teardown-pdb        purge YOUR personal sandbox only

manifest_version: 2
type: DCM_PROJECT
default_target: 'DEV'

targets:
  DEV:
    account_identifier: SFSENORTHAMERICA-DGILLIS_AWS_USEAST1_V1
    project_name: 'util.dcm_project_archive.dbt_demo_dev'
    project_owner: ACCOUNTADMIN
    templating_config: 'DEV'
  PROD:
    account_identifier: SFSENORTHAMERICA-DGILLIS_AWS_USEAST1_V1
    project_name: 'util.dcm_project_archive.dbt_demo_prod'
    project_owner: ACCOUNTADMIN
    templating_config: 'PROD'
  # Per-developer sandbox. Both project_name here and `base` in the DBT_PDB
  # configuration are overridden at run time with the caller's username, so the
  # real project object is util.dcm_project_archive.dbt_demo_pdb_<user>.
  #
  # A per-user project object is mandatory, not cosmetic. A DCM project deploys
  # "desired state minus current state", so if every developer shared one project
  # object, the second person to deploy would see the first person's database,
  # warehouses, and roles as objects no longer in the definitions and DROP all of
  # them. Separate registrations keep each sandbox's state independent.
  DBT_PDB:
    account_identifier: SFSENORTHAMERICA-DGILLIS_AWS_USEAST1_V1
    project_name: 'util.dcm_project_archive.dbt_demo_pdb_unset'
    project_owner: ACCOUNTADMIN
    templating_config: 'DBT_PDB'

templating:
  defaults:
    # Base name shared by every object in the target: the database is named
    # exactly this, and the warehouses and roles are named with it as a prefix
    # (<base>_xs_wh, <base>_rw). It is the only thing distinguishing one target's
    # objects from another's.
    #
    # This holds the WHOLE name rather than just an environment tag, which is why
    # the definitions say `{{ base }}` and not `{{ env }}_dbt_demo`. The old form
    # hardcoded the "_dbt_demo" stem into all 93 references, so a target could
    # only ever be <something>_dbt_demo -- there was no way to express a name like
    # dbt_pdb_dgillis.
    base: 'dev_dbt_demo'

    # Human-readable form used in COMMENT text.
    env_label: 'dev'

    # The warehouse fleet. Sizes are per-configuration so prod can run bigger
    # compute without duplicating the definitions.
    #
    # Use XXLARGE, not 2XLARGE: DCM rejects the 2XLARGE spelling with
    # "invalid type of property '2XLARGE' for 'WAREHOUSE_SIZE'".
    warehouses:
      - { suffix: 'xs',  size: 'XSMALL' }
      - { suffix: 's',   size: 'SMALL' }
      - { suffix: 'm',   size: 'MEDIUM' }
      - { suffix: 'l',   size: 'LARGE' }
      - { suffix: 'xl',  size: 'XLARGE' }
      - { suffix: 'xxl', size: 'XXLARGE' }

    # Schemas created in the environment database.
    schemas:
      - { name: 'raw',       comment: 'RAW data landing schema' }
      - { name: 'curated',   comment: 'Curated object schema' }
      - { name: 'modeled',   comment: 'Modeled object schema' }
      - { name: 'utilities', comment: 'global utilities and tools' }

    # Users granted the data engineer functional role. Previously a hardcoded
    # `GRANT ROLE dbt_demo_data_engineer TO USER tastyb`, which failed on any
    # account without that user.
    admin_users: []

  configurations:
    DEV:
      base: 'dev_dbt_demo'
      env_label: 'dev'
      admin_users: ['tastyb']

    PROD:
      base: 'prod_dbt_demo'
      env_label: 'prod'
      # No standing human access to prod; grant deliberately.
      admin_users: []

    # Per-developer sandbox. `base` is ALWAYS overridden at run time with
    # -D "base='dbt_pdb_<user>'" by the task layer, which resolves <user> from
    # CURRENT_USER(). Runtime --variable is the highest tier of DCM's variable
    # resolution, above both defaults and this configuration.
    #
    # The checked-in value is a deliberate dummy rather than a real developer's
    # name. It is what a bare `snow dcm deploy --target DBT_PDB` would use if
    # someone bypassed the tasks, and the failure mode matters: a real name here
    # would mean that invocation silently adopted -- and on the next deploy could
    # drop -- that person's sandbox. `dbt_pdb_unset` instead creates obvious junk
    # that is safe to drop and names the mistake.
    #
    # Everything else is inherited from defaults, so a sandbox is a faithful copy
    # of DEV: same 4 schemas, same 9 raw tables, same 6 warehouses, same 4 roles
    # with the same grants. To give sandboxes a smaller warehouse fleet than the
    # shared environments, override `warehouses` here.
    DBT_PDB:
      base: 'dbt_pdb_unset'
      env_label: 'pdb sandbox'
      # A sandbox is owned by the developer who deploys it. Granting the
      # functional role to a fixed list of admins would defeat that.
      admin_users: []
