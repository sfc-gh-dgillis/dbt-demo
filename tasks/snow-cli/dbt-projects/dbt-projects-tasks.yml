version: '3'

# Tasks for dbt Projects on Snowflake: the project is deployed INTO Snowflake as a
# DBT PROJECT object and executed there, rather than run from a laptop. For tasks
# that run dbt locally against a credentialed profile, see tasks/dbt.
#
# The root Taskfile include sets `dir:` to this directory, so every relative path
# below is resolved from tasks/snow-cli/dbt-projects. That is why the build
# directory is three levels up (../../../.build/dbt) while cmd/ is a plain
# sibling.

tasks:

  stage-dbt-project:
    desc: Stages a clean copy of the dbt project (excludes .venv, .git, target, logs) for deployment.
    internal: true
    vars:
      DBT_BUILD_DIR: '{{.DBT_BUILD_DIR | default "../../../.build/dbt"}}'
    cmds:
      - cmd/stage-dbt-project.sh "{{.DBT_BUILD_DIR}}"

  deploy-dbt-project:
    desc: Stages and deploys the dbt project object, adding a new version if it already exists.
    internal: true
    vars:
      DBT_BUILD_DIR: '{{.DBT_BUILD_DIR | default "../../../.build/dbt"}}'
      DBT_PROJECT_OBJECT_NAME: '{{.DBT_PROJECT_OBJECT_NAME | default "tasty_bytes"}}'
      # Names the target that deploy's COMPILATION phase opens a session with, and
      # the fallback for any EXECUTE DBT PROJECT whose ARGS omit --target.
      #
      # `deploy` rather than dev or dbt_pdb because compile runs as the deploying
      # admin: dbt_pdb resolves its role from CURRENT_USER() and would look for
      # DBT_PDB_<ADMIN>_data_engineer, while dev and prod name roles that exist
      # only when those environments are deployed. See the `deploy` environment in
      # env.yml. Every run task passes --target explicitly, so this only governs
      # compile.
      DBT_DEFAULT_TARGET: '{{.DBT_DEFAULT_TARGET | default "deploy"}}'
      DBT_RUNTIME_VERSION: '{{.DBT_RUNTIME_VERSION | default "1.11.11"}}'
    cmds:
      - task: stage-dbt-project
        vars:
          DBT_BUILD_DIR: '{{.DBT_BUILD_DIR}}'
      # Deliberately no --profiles-dir: the staged project already contains a
      # credential-free profiles.yml. Pointing at ~/.dbt would supply a
      # profiles.yml containing a password, which snow dbt deploy rejects.
      # Omit --force: without it an existing object gains a new version, while
      # --force runs CREATE OR REPLACE and destroys all versions and run history.
      #
      # The object name is fully qualified rather than relying on --database and
      # --schema. On Snowflake CLI 3.24.1 those are connection overrides, and
      # --database is not applied when snow dbt deploy creates its temporary
      # stage: the stage is attempted in <connection default database>.<--schema>,
      # so with a connection defaulting to UTIL_DB the deploy fails with
      # "Schema 'UTIL_DB.UTILITIES' does not exist or not authorized".
      - >-
        snow dbt deploy
        "{{.DBT_PROJECT_DATABASE}}.{{.DBT_PROJECT_SCHEMA}}.{{.DBT_PROJECT_OBJECT_NAME}}"
        --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}"
        --source "{{.DBT_BUILD_DIR}}"
        --default-target "{{.DBT_DEFAULT_TARGET}}"
        --dbt-version "{{.DBT_RUNTIME_VERSION}}"

  execute-dbt-project:
    desc: Executes a dbt command on the deployed project object with an env.yml environment.
    internal: true
    vars:
      DBT_PROJECT_OBJECT_NAME: '{{.DBT_PROJECT_OBJECT_NAME | default "tasty_bytes"}}'
      DBT_ENVIRONMENT: '{{.DBT_ENVIRONMENT | default "dbt_pdb"}}'
    preconditions:
      # The caller passes a PAT connection that deliberately stores no password,
      # so without this variable authentication fails with "Programmatic access
      # token is invalid" -- which reads like a bad token rather than a missing
      # one. Checked here so the message names the actual fix.
      - sh: '[ -n "$DBT_ENV_SECRET_PAT" ]'
        msg: |
          DBT_ENV_SECRET_PAT is not set, so the dbt execution connection has no token.
          Mint one with `task pat-create`, then `source ~/.zshrc` (a token written to
          the rc file is not visible to the shell that wrote it).
    cmds:
      # EXECUTE DBT PROJECT via SQL is the only way to select an env.yml
      # environment or override variables on Snowflake CLI 3.24.1: it has no
      # --env or --env-vars flags (--environment is an alias for --connection).
      # --warehouse aligns the outer session with the profiles.yml warehouse so
      # a single run does not wake two warehouses.
      #
      # The token is injected as the connection's password rather than stored in
      # connections.toml, so it lives in exactly one place and rotating it cannot
      # leave a stale copy behind. Two details matter:
      #   - the variable is SNOWFLAKE_CONNECTIONS_<CONNECTION>_PASSWORD, derived
      #     from the connection name. The generic SNOWFLAKE_PASSWORD is silently
      #     IGNORED for a named connection -- it fails as an invalid token, with
      #     nothing to indicate the variable was never read.
      #   - it is exported into this command's environment only, never passed as
      #     an argument, because argv is readable by any process via `ps`.
      - |
        connection_suffix=$(printf '%s' "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}" | tr 'a-z-' 'A-Z_')
        export "SNOWFLAKE_CONNECTIONS_${connection_suffix}_PASSWORD=$DBT_ENV_SECRET_PAT"
        snow sql \
          --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}" \
          --warehouse "{{.DBT_WAREHOUSE}}" \
          --query "EXECUTE DBT PROJECT {{.DBT_PROJECT_DATABASE}}.{{.DBT_PROJECT_SCHEMA}}.{{.DBT_PROJECT_OBJECT_NAME}}
          ARGS = '{{.DBT_ARGS}}'
          ENVIRONMENT = '{{.DBT_ENVIRONMENT}}'{{if .DBT_ENV_VARS}}
          ENV_VARS = ({{.DBT_ENV_VARS}}){{end}};"


  describe-dbt-project:
    desc: Describes the deployed dbt project object.
    internal: true
    cmds:
      # Not `snow dbt list`: on Snowflake CLI 3.24.1 its --database is a connection
      # override that never reaches the session, so the SHOW fails with "This
      # session does not have a current database", and --in schema rejects a
      # qualified name ("Scope name must be a valid identifier"). That leaves no
      # working flag combination for a project outside the connection's default
      # database. Issue the qualified SHOW directly instead, same as dcm-list.
      - >-
        snow sql
        --connection "{{.SNOW_CLI_ADMIN_CONNECTION_NAME}}"
        --query "SHOW DBT PROJECTS IN SCHEMA {{.DBT_PROJECT_DATABASE}}.{{.DBT_PROJECT_SCHEMA}};"
