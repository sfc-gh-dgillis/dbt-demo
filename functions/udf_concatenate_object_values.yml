# Sorts an OBJECT's keys, uppercases its values, and joins them with '-'. The
# building block for udf_generate_surrogate_key, which hashes this output.
#
# Previously created by the macro macros/create_udf_concatenate_object_values.sql
# via `dbt run-operation`, which meant the UDFs had to be built by a separate
# bootstrap step before any model that used them. As a function resource dbt
# builds it as a DAG node, ahead of the models that reference it.
#
# Note the default null token here differs from the one in
# udf_generate_surrogate_key. Callers of the surrogate key function get that
# function's default ('_dbt_utils_surrogate_key_null_'), which it passes down
# explicitly. Both are load bearing: they are hashed into every surrogate key in
# the marts, so changing either silently invalidates existing keys.
functions:
  - name: udf_concatenate_object_values
    description: >
      Concatenates an OBJECT's values in key order, separated by '-', uppercasing
      each value and substituting default_null_value for NULL, empty string, and
      empty array.
    config:
      schema: utilities
      runtime_version: "3.12"
      entry_point: concatenate_dict_values
    arguments:
      - name: o
        data_type: object
        description: The object whose values are concatenated, in sorted key order.
      - name: default_null_value
        data_type: varchar
        description: Substituted (uppercased) for any NULL, empty string, or empty array value.
        default_value: "'_SURROGATE_KEY_NULL_'"
    returns:
      data_type: string
