# MD5 hash of udf_concatenate_object_values' output: the surrogate key used by
# every dimension and fact in models/marts.
#
# The body calls the other function through {{ function(...) }} rather than a
# hardcoded database.schema prefix, which is the reason for preferring a dbt
# function resource over a DCM DEFINE FUNCTION here. DCM does not dependency-sort
# functions, so a SQL function whose body references another function can be
# created first and fail; dbt makes both DAG nodes and orders them.
#
# default_null_value is '_dbt_utils_surrogate_key_null_' rather than the
# '_SURROGATE_KEY_NULL_' default of the function it calls, and it is passed down
# explicitly so the inner default never applies. That token is uppercased and
# hashed into the key of every NULL-bearing grain, so changing it rewrites
# surrogate keys across all the marts.
functions:
  - name: udf_generate_surrogate_key
    description: >
      Returns a BINARY MD5 surrogate key for an OBJECT, typically built with
      OBJECT_CONSTRUCT_KEEP_NULL over the columns forming the natural grain.
    config:
      schema: utilities
    arguments:
      - name: o
        data_type: object
        description: The object whose values form the key, in sorted key order.
      - name: default_null_value
        data_type: varchar
        description: Substituted for NULL, empty string, or empty array before hashing.
        default_value: "'_dbt_utils_surrogate_key_null_'"
    returns:
      data_type: binary
