# Environment variables for dbt Projects on Snowflake.
env_config:
  # The environment used when nothing higher in the precedence chain specifies
  # one. Deliberately the sandbox, not prod.
  #
  # Environment selection resolves highest priority first:
  #   1. ENVIRONMENT on EXECUTE DBT PROJECT, or --env on the Snowflake CLI
  #   2. DEFAULT_ENVIRONMENT set on the dbt project object
  #   3. this value
  #
  # So this only takes effect when the caller named no environment, which in
  # practice means an interactive Run from CoCo Desktop or Workspaces. That is
  # exactly the case where inheriting prod is dangerous: a laptop Run would
  # build into dbt_prod, and accountadmin inherits sysadmin, which roles.sql
  # grants dbt_prod_data_engineer, so nothing would stop it.
  #
  # Nothing automated depends on this default. Both GitHub workflows pass --env
  # explicitly (tier 1), and merge_main.yml additionally sets --default-env prod
  # on the production project object (tier 2), so scheduled tasks and ad-hoc
  # EXECUTE DBT PROJECT calls against it still resolve prod. Production is now
  # always a deliberate choice rather than a fallthrough.
  default_environment: dbt_pdb
  environments:
    - name: prod
      env:
        DBT_CURRENT_DB: dbt_prod
        # Must be one of the `shared_schemas` in macros/generate_schema_name.sql,
        # and is where models with no `+schema:` config land (the marts). Setting
        # it to `raw` sends the override down its per-developer branch, which
        # returns target.schema for every node and collapses raw, curated, and
        # modeled into one schema.
        DBT_CURRENT_SCHEMA: modeled
        DBT_CURRENT_WH: dbt_prod_s_wh
        DBT_CURRENT_ROLE: dbt_prod_data_engineer

    # CI environment for pull request validation.
    #
    # Identical to `prod` in every respect except the database, which the caller
    # is expected to override per pull request:
    #
    #   EXECUTE DBT PROJECT ...
    #     ENVIRONMENT = 'ci'
    #     ENV_VARS = ('DBT_CURRENT_DB' = 'dbt_ci_pr_123')
    #
    # ENV_VARS is the highest tier of value precedence, so it wins over the
    # value below unconditionally.
    #
    # The default is deliberately a database that does not exist. env.yml
    # requires every key to carry a value, and the only safe value here is one
    # that fails the run rather than one that succeeds against the wrong target.
    # If the override is ever dropped from the workflow, the run errors on a
    # missing database instead of quietly rebuilding production -- which is the
    # exact failure this environment exists to prevent.
    - name: ci
      env:
        DBT_CURRENT_DB: xx_dbt_ci_db_override_not_supplied
        DBT_CURRENT_SCHEMA: modeled
        DBT_CURRENT_WH: dbt_prod_s_wh
        # Unchanged from prod on purpose. CI exercises the same least-privilege
        # role as production rather than a special-cased CI role, so a PR that
        # needs a grant it does not have fails in CI instead of at deploy time.
        # The per-PR clone is granted to dbt_prod_rw, which this role inherits.
        DBT_CURRENT_ROLE: dbt_prod_data_engineer

    # Per-developer sandbox, used from CoCo Desktop in Snowflake-managed mode
    # and from Workspaces.
    #
    # This is the environment that makes the sandbox safe. Without it the file
    # falls back to default_environment: prod, and a Run in CoCo Desktop builds
    # straight into dbt_prod from a laptop -- accountadmin inherits sysadmin,
    # which roles.sql grants dbt_prod_data_engineer, so nothing stops it.
    #
    # One environment serves every developer rather than one entry per person.
    # DBT_CURRENT_DB resolves to the sandbox that `task demo-up-pdb` creates,
    # which names it dbt_pdb_<DBT_PDB_USERNAME>.
    #
    # Role and warehouse deliberately pass through the caller's session instead
    # of being computed. Workspaces pre-validates those two profile fields and
    # accepts only a bare context function, so an expression like
    # "{{ select 'dbt_pdb_' || CURRENT_USER() || '_data_engineer' }}" fails with
    # "env.yml value contains Jinja that is not a supported Snowflake context
    # function." The database and schema fields have no such restriction, which
    # is why the concatenation is fine there.
    #
    # The practical consequence: whatever role and warehouse your connection
    # carries is what the build runs as. Set them in connections.toml.
    - name: dbt_pdb
      env:
        DBT_CURRENT_DB: "{{ select 'dbt_pdb_' || CURRENT_USER() }}"
        # Pinned to modeled, not the per-developer branch of
        # macros/generate_schema_name.sql. The sandbox isolates by DATABASE, so
        # keeping the schema shared preserves the raw / curated / modeled
        # layering inside it. See the note in that macro.
        DBT_CURRENT_SCHEMA: modeled
        DBT_CURRENT_WH: "{{ select CURRENT_WAREHOUSE() }}"
        DBT_CURRENT_ROLE: "{{ select CURRENT_ROLE() }}"
