# Environment variables for dbt Projects on Snowflake.
#
# Snowflake resolves this file BEFORE dbt starts, then injects the results as
# environment variables. profiles.yml reads them with env_var(). That is why
# values can come from live SQL.
#
# Rules enforced on every run (violations fail the run):
#   - every key is prefixed DBT_ and is UPPERCASE
#   - keys are plain text, never SQL
#   - only the "{{ select <query> }}" Jinja pattern is allowed in values;
#     no loops, conditionals, filters, or dbt macros
#   - a value must resolve to a single row and a single VARCHAR column
#
# Context functions resolve against the OUTER session that issued
# EXECUTE DBT PROJECT (the task, worksheet, or Snowflake CLI call), not the
# role in profiles.yml.
#
# Environment selection, highest priority first:
#   1. ENVIRONMENT = '...' on EXECUTE DBT PROJECT
#   2. DEFAULT_ENVIRONMENT on the dbt project object
#   3. default_environment below
# Use the reserved name NO_ENV to run with no environment at all.
#
# Value precedence, highest first: ENV_VARS on EXECUTE DBT PROJECT, then the
# selected environment below.

env_config:
  default_environment: dev

  environments:

    # Shared development target. Marts land in dev_dbt_demo.modeled.
    - name: dev
      env:
        DBT_CURRENT_DB: dev_dbt_demo
        DBT_CURRENT_SCHEMA: modeled
        DBT_CURRENT_WH: dev_dbt_demo_s_wh
        # Bare context function: Workspaces validates the role and warehouse
        # fields and rejects expressions that wrap them.
        DBT_CURRENT_ROLE: "{{ select CURRENT_ROLE() }}"

    # Per-developer isolation. Each engineer builds into their own schema, so
    # concurrent work never collides in the shared modeled schema.
    # dgillis@example.com -> dgillis     first.last@example.com -> first_last
    - name: dev_user
      env:
        DBT_CURRENT_DB: dev_dbt_demo
        DBT_CURRENT_SCHEMA: "{{ select REPLACE(SPLIT_PART(CURRENT_USER(), '@', 1), '.', '_') }}"
        DBT_CURRENT_WH: dev_dbt_demo_s_wh
        DBT_CURRENT_ROLE: "{{ select CURRENT_ROLE() }}"

    # Production target.
    - name: prod
      env:
        DBT_CURRENT_DB: prod_dbt_demo
        DBT_CURRENT_SCHEMA: modeled
        DBT_CURRENT_WH: prod_dbt_demo_m_wh
        DBT_CURRENT_ROLE: "{{ select CURRENT_ROLE() }}"
