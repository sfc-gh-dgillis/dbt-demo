# Environment variables for dbt Projects on Snowflake.
env_config:

  environments:

    - name: dbt_pdb
      env:
        DBT_CURRENT_DB: "DBT_PDB_{{ select CURRENT_USER() }}"
        DBT_CURRENT_WH: "DBT_PDB_{{ select CURRENT_USER() }}_s_wh"
        DBT_CURRENT_ROLE: "DBT_PDB_{{ select CURRENT_USER() }}_data_engineer"


    # Shared development target. Marts land in dev_dbt_demo.modeled.
    - name: dev
      env:
        DBT_CURRENT_DB: dev_dbt_demo
        DBT_CURRENT_SCHEMA: modeled
        DBT_CURRENT_WH: dev_dbt_demo_s_wh
        DBT_CURRENT_ROLE: dev_dbt_demo_data_engineer

    # Production target.
    - name: prod
      env:
        DBT_CURRENT_DB: prod_dbt_demo
        DBT_CURRENT_SCHEMA: modeled
        DBT_CURRENT_WH: prod_dbt_demo_m_wh
        DBT_CURRENT_ROLE: prod_dbt_demo_data_engineer
